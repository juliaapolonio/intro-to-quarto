name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necessário para o Quarto poder empurrar para a branch gh-pages
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Este workflow NÃO instala R.
      # Ele depende de `execute: freeze: auto` (definido no _quarto.yml) e da
      # pasta `_freeze/`, que você renderiza localmente e commita.
      # Veja a seção "Publicação" do README.
      - name: Conferir se o _freeze foi commitado
        run: |
          if [ ! -d "_freeze" ]; then
            echo "::error::A pasta _freeze/ não existe. Rode 'quarto render' localmente e commite _freeze/ antes de publicar."
            exit 1
          fi

      - name: Renderizar e publicar no GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
