name: quarto-env

channels:
  - conda-forge

dependencies:
  # Quarto e o motor de renderização
  - quarto>=1.4
  - r-base>=4.3
  - r-knitr
  - r-rmarkdown
  - r-codetools   # exigido pelo cache do knitr; nem toda instalação de R o traz

  # Usados nos exemplos e nas soluções dos exercícios
  - r-ggplot2
  - r-kableextra
  - r-gt
  - r-dt

  # Suporte a Python nos exemplos poliglotas (opcional, mas leve)
  - python>=3.11
  - jupyter
  - pandas
  - matplotlib
  # Necessário apenas se você quiser EXECUTAR chunks Python com o motor knitr.
  # No material do curso os chunks Python são apenas exibidos, então isto é
  # opcional — mas deixa o ambiente pronto caso alguém queira experimentar.
  - r-reticulate

  # Ferramentas de apoio
  - git
